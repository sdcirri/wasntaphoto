name: Frontend Tests

on:
  push:
    branches: ["main"]
    paths:
      - "webui/**"
      - "Dockerfile.frontend"
  pull_request:
    paths:
      - "webui/**"
      - "Dockerfile.frontend"
  workflow_dispatch:

jobs:
  vitest:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: webui

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: webui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test
